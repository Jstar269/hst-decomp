name: Progress report

# Publishes the objdiff progress report that recomp.fyi reads (https://recomp.fyi/add). Public CI cannot build this
# project (no game, no keys, no compiler), so the report is generated by the maintainers' tooling
# (tools/hstreport.py, run by tools/hstprogress.py --write) from the same figures as the README table and committed as
# docs/objdiff-report.json. This workflow only uploads that file as the artifact UCUS98701_report (the serial of the
# release the .recomp.json row works from).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the report as build/report.json
        run: |
          mkdir -p build
          cp docs/objdiff-report.json build/report.json
      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UCUS98701_report
          path: build/report.json
          if-no-files-found: error
