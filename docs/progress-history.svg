<text class="t1" x="28" y="34" font-size="17" font-weight="600">Progress over time</text><text class="t3" x="28" y="54" font-size="12">Blue: the README figure (tier 1, public sources, share of the two game modules' code bytes). Red, dashed: strict, share of all bytes of the six modules.</text><line class="grid" x1="64" x2="892" y1="252.0" y2="252.0" stroke-width="1"/><text class="t3 num" x="56" y="256.0" font-size="11" text-anchor="end">0%</text><line class="grid" x1="64" x2="892" y1="196.0" y2="196.0" stroke-width="1"/><text class="t3 num" x="56" y="200.0" font-size="11" text-anchor="end">10%</text><line class="grid" x1="64" x2="892" y1="140.0" y2="140.0" stroke-width="1"/><text class="t3 num" x="56" y="144.0" font-size="11" text-anchor="end">20%</text><line class="grid" x1="64" x2="892" y1="84.0" y2="84.0" stroke-width="1"/><text class="t3 num" x="56" y="88.0" font-size="11" text-anchor="end">30%</text><text class="t3 num" x="64.0" y="272" font-size="11" text-anchor="middle">10-17</text><text class="t3 num" x="478.0" y="272" font-size="11" text-anchor="middle">10-19</text><text class="t3 num" x="685.0" y="272" font-size="11" text-anchor="middle">10-20</text><text class="t3 num" x="892.0" y="272" font-size="11" text-anchor="middle">10-21</text><path class="ln" d="M64.0,127.7 L478.0,117.9 L685.0,117.3 L892.0,99.1"/><path class="ln2" d="M64,252.0 L892,252.0"/><circle class="dot" cx="64.0" cy="127.7" r="4"><title>2026-10-17: 22.199%</title></circle><circle class="dot" cx="478.0" cy="117.9" r="4"><title>2026-10-19: 23.949%</title></circle><circle class="dot" cx="685.0" cy="117.3" r="4"><title>2026-10-20: 24.055%</title></circle><circle class="dot" cx="892.0" cy="99.1" r="4"><title>2026-10-21: 27.311%</title></circle><text class="t1 num" x="884.0" y="89.1" font-size="12" text-anchor="end">27.31%</text></svg>
